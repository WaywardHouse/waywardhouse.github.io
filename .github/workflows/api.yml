# Deploy the /api/* Cloudflare Worker (Pepper + newsletter) when worker/ changes.
#
# Secrets: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit, Workers Routes:Edit, D1, Vectorize,
# Workers AI), CLOUDFLARE_ACCOUNT_ID.
# The Resend key lives on the Worker itself:  npx wrangler secret put RESEND_API_KEY --config worker/wrangler.toml

name: Deploy API worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/api.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
